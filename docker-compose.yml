# Infrastruktura deweloperska: PostgreSQL + Redis.
# Aplikację (npm run dev) i worker (npm run worker) uruchamiasz lokalnie — wymagają FFmpeg.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detailreel
      POSTGRES_PASSWORD: detailreel
      POSTGRES_DB: detailreel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detailreel"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
